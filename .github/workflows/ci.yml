name: Validate Plica
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements-test.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 validate_content.py
      - run: python3 build.py
      - run: node --check site/assets/site.js
      - name: Check generated snapshots are current
        run: git diff --exit-code -- site/
      - name: Test HTTP navigation at root and project prefix
        run: python3 test_site.py
        env:
          PLICA_TEST_OUTPUT: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
